<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1560" width="1000" height="1560" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3a8a"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Title Header Banner -->
  <rect x="40" y="30" width="920" height="90" rx="12" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="500" y="68" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700" letter-spacing="0.3">RESEARCH METHODOLOGY FLOWCHART</text>
  <text x="500" y="96" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="400">Explainable Deep Learning Framework for Phishing &amp; Malicious URL Detection</text>

  <!-- ==================== PHASE 1 ==================== -->
  <g id="phase1">
    <!-- Phase Container -->
    <rect x="40" y="150" width="920" height="205" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="40" y="150" width="920" height="38" rx="12" fill="#eff6ff"/>
    <rect x="40" y="176" width="920" height="12" fill="#eff6ff"/>
    <text x="60" y="175" fill="#1e40af" font-size="15" font-weight="700" letter-spacing="0.5">PHASE 1: DATASET ACQUISITION &amp; PREPROCESSING</text>

    <!-- Step 1.1 -->
    <rect x="65" y="205" width="260" height="120" rx="8" fill="url(#cardGrad1)" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="195" y="233" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Raw URL Corpus</text>
    <path d="M 85 243 L 305 243" stroke="#e2e8f0" stroke-width="1"/>
    <text x="85" y="265" fill="#475569" font-size="12">• Benign URLs (Legitimate)</text>
    <text x="85" y="287" fill="#475569" font-size="12">• Phishing &amp; Malicious URLs</text>
    <text x="85" y="309" fill="#475569" font-size="12">• Verified cyber threat sources</text>

    <!-- Connector 1.1 -> 1.2 -->
    <line x1="325" y1="265" x2="368" y2="265" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 1.2 -->
    <rect x="370" y="205" width="260" height="120" rx="8" fill="url(#cardGrad1)" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="500" y="233" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Data Cleansing</text>
    <path d="M 390 243 L 610 243" stroke="#e2e8f0" stroke-width="1"/>
    <text x="390" y="265" fill="#475569" font-size="12">• Deduplication by exact URL</text>
    <text x="390" y="287" fill="#475569" font-size="12">• Protocol &amp; string normalization</text>
    <text x="390" y="309" fill="#475569" font-size="12">• Corrupted character removal</text>

    <!-- Connector 1.2 -> 1.3 -->
    <line x1="630" y1="265" x2="673" y2="265" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 1.3 -->
    <rect x="675" y="205" width="260" height="120" rx="8" fill="url(#cardGrad1)" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="805" y="233" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Dataset Partitioning</text>
    <path d="M 695 243 L 915 243" stroke="#e2e8f0" stroke-width="1"/>
    <text x="695" y="265" fill="#475569" font-size="12">• Stratified Train / Validation Split</text>
    <text x="695" y="287" fill="#475569" font-size="12">• Strictly held-out test split</text>
    <text x="695" y="309" fill="#475569" font-size="12">• Zero train-eval data leakage</text>
  </g>

  <!-- Inter-Phase Connector 1 -> 2 -->
  <line x1="500" y1="355" x2="500" y2="395" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- ==================== PHASE 2 ==================== -->
  <g id="phase2">
    <!-- Phase Container -->
    <rect x="40" y="400" width="920" height="245" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="40" y="400" width="920" height="38" rx="12" fill="#eff6ff"/>
    <rect x="40" y="426" width="920" height="12" fill="#eff6ff"/>
    <text x="60" y="425" fill="#1e40af" font-size="15" font-weight="700" letter-spacing="0.5">PHASE 2: FEATURE EXTRACTION &amp; MODEL BENCHMARKING</text>

    <!-- Branch A: ML Baselines -->
    <rect x="65" y="455" width="260" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="195" y="480" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Lexical Feature Extraction</text>
    <text x="85" y="503" fill="#64748b" font-size="11.5">• Length, digits, delimiters, entropy</text>

    <line x1="195" y1="530" x2="195" y2="550" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="65" y="555" width="260" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="195" y="580" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">ML Baselines</text>
    <text x="195" y="605" text-anchor="middle" fill="#475569" font-size="12">Random Forest &amp; XGBoost</text>

    <!-- Branch B: Deep Learning -->
    <rect x="370" y="455" width="260" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="500" y="480" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Sub-word Tokenization</text>
    <text x="390" y="503" fill="#64748b" font-size="11.5">• Fast DistilBERT tokenizer (max_len=96)</text>

    <line x1="500" y1="530" x2="500" y2="550" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="370" y="555" width="260" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="500" y="580" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">Deep Learning Model</text>
    <text x="500" y="605" text-anchor="middle" fill="#475569" font-size="12">Fine-Tuned DistilBERT Classifier</text>

    <!-- Merge arrows to Step 2.3 -->
    <path d="M 325 590 L 345 590 L 345 540 L 665 540" fill="none" stroke="#3b82f6" stroke-width="1.8"/>
    <line x1="630" y1="590" x2="665" y2="590" stroke="#3b82f6" stroke-width="1.8"/>
    <line x1="665" y1="565" x2="675" y2="565" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Step 2.3: Evaluation & Selection -->
    <rect x="675" y="475" width="260" height="145" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="805" y="505" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Model Evaluation &amp; Selection</text>
    <path d="M 695 517 L 915 517" stroke="#bfdbfe" stroke-width="1"/>
    <text x="695" y="539" fill="#334155" font-size="12">• Metrics: Acc, Prec, Rec, F1, AUC</text>
    <text x="695" y="561" fill="#334155" font-size="12">• Transformer vs. ML Comparison</text>
    <rect x="690" y="575" width="230" height="32" rx="6" fill="#1e3a8a"/>
    <text x="805" y="596" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Selected: DistilBERT Checkpoint</text>
  </g>

  <!-- Inter-Phase Connector 2 -> 3 -->
  <line x1="500" y1="645" x2="500" y2="685" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- ==================== PHASE 3 ==================== -->
  <g id="phase3">
    <!-- Phase Container -->
    <rect x="40" y="690" width="920" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="40" y="690" width="920" height="38" rx="12" fill="#eff6ff"/>
    <rect x="40" y="716" width="920" height="12" fill="#eff6ff"/>
    <text x="60" y="715" fill="#1e40af" font-size="15" font-weight="700" letter-spacing="0.5">PHASE 3: MULTI-METHOD EXPLAINABLE AI (XAI) ENGINE</text>

    <!-- Method A: IG -->
    <rect x="65" y="745" width="260" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="75" y="755" width="45" height="20" rx="4" fill="#6366f1"/>
    <text x="97" y="769" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">IG</text>
    <text x="130" y="770" fill="#0f172a" font-size="13" font-weight="700">Integrated Gradients</text>
    <text x="80" y="795" fill="#475569" font-size="11.5">• Axiomatic gradient path</text>
    <text x="80" y="815" fill="#475569" font-size="11.5">• Baseline: [PAD] token embeddings</text>
    <text x="80" y="832" fill="#475569" font-size="11">• Logit-level attribution space</text>

    <!-- Method B: LIME -->
    <rect x="370" y="745" width="260" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="380" y="755" width="48" height="20" rx="4" fill="#f97316"/>
    <text x="404" y="769" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">LIME</text>
    <text x="438" y="770" fill="#0f172a" font-size="13" font-weight="700">Local Surrogate</text>
    <text x="385" y="795" fill="#475569" font-size="11.5">• URL token/delimiter regex</text>
    <text x="385" y="815" fill="#475569" font-size="11.5">• 150 local perturbation samples</text>
    <text x="385" y="832" fill="#475569" font-size="11">• Local linear surrogate weights</text>

    <!-- Method C: SHAP -->
    <rect x="675" y="745" width="260" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="685" y="755" width="48" height="20" rx="4" fill="#0d9488"/>
    <text x="709" y="769" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">SHAP</text>
    <text x="743" y="770" fill="#0f172a" font-size="13" font-weight="700">Shapley Partition</text>
    <text x="690" y="795" fill="#475569" font-size="11.5">• Text masker partition explainer</text>
    <text x="690" y="815" fill="#475569" font-size="11.5">• Coalition game theory (192 evals)</text>
    <text x="690" y="832" fill="#475569" font-size="11">• Probability contribution values</text>

    <!-- Connecting lines down to Component Mapping -->
    <line x1="195" y1="840" x2="195" y2="865" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="500" y1="840" x2="500" y2="865" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="805" y1="840" x2="805" y2="865" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 195 865 L 805 865" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="500" y1="865" x2="500" y2="880" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Component Mapping Box -->
    <rect x="180" y="880" width="640" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="500" y="904" text-anchor="middle" fill="#1e3a8a" font-size="13.5" font-weight="700">Token-to-Component Attribution Mapping</text>
    <text x="500" y="924" text-anchor="middle" fill="#475569" font-size="12">Aggregates sub-word scores into RFC URL segments: Subdomain | Domain | Path | Query</text>
  </g>

  <!-- Dual Branch Connector from Phase 3 to 4 & 5 -->
  <line x1="500" y1="950" x2="500" y2="990" stroke="#1e3a8a" stroke-width="2.5"/>
  <path d="M 280 990 L 720 990" stroke="#1e3a8a" stroke-width="2.5"/>
  <line x1="280" y1="990" x2="280" y2="1010" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <line x1="720" y1="990" x2="720" y2="1010" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- ==================== PHASE 4 (Left) ==================== -->
  <g id="phase4">
    <rect x="40" y="1015" width="445" height="425" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="40" y="1015" width="445" height="38" rx="12" fill="#eff6ff"/>
    <rect x="40" y="1041" width="445" height="12" fill="#eff6ff"/>
    <text x="60" y="1040" fill="#1e40af" font-size="14" font-weight="700" letter-spacing="0.3">PHASE 4: 200-URL SCIENTIFIC BENCHMARK</text>

    <!-- Evaluation Benchmark Set -->
    <rect x="65" y="1070" width="395" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="262" y="1093" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Held-Out Balanced Dataset</text>
    <text x="262" y="1114" text-anchor="middle" fill="#475569" font-size="12">100 Benign URLs + 100 Malicious URLs</text>

    <!-- Metrics List -->
    <g transform="translate(65, 1145)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="395" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="24" fill="#0f172a" font-size="12.5" font-weight="700">Faithfulness: Occlusion Agreement (ρ)</text>
      <text x="15" y="44" fill="#64748b" font-size="11.5">Spearman correlation with probability drops</text>

      <!-- Metric 2 -->
      <rect x="0" y="70" width="395" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="94" fill="#0f172a" font-size="12.5" font-weight="700">Plausibility: Top-2 Deletion Drop</text>
      <text x="15" y="114" fill="#64748b" font-size="11.5">Confidence degradation upon removing top components</text>

      <!-- Metric 3 -->
      <rect x="0" y="140" width="395" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="164" fill="#0f172a" font-size="12.5" font-weight="700">Stability: Cosine Similarity</text>
      <text x="15" y="184" fill="#64748b" font-size="11.5">Attribution robustness under deterministic URL edits</text>

      <!-- Metric 4 -->
      <rect x="0" y="210" width="395" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="234" fill="#0f172a" font-size="12.5" font-weight="700">Efficiency: Wall-Clock Runtime (s)</text>
      <text x="15" y="254" fill="#64748b" font-size="11.5">Mean inference latency per explanation (IG vs LIME vs SHAP)</text>
    </g>
  </g>

  <!-- ==================== PHASE 5 (Right) ==================== -->
  <g id="phase5">
    <rect x="515" y="1015" width="445" height="425" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="515" y="1015" width="445" height="38" rx="12" fill="#eff6ff"/>
    <rect x="515" y="1041" width="445" height="12" fill="#eff6ff"/>
    <text x="535" y="1040" fill="#1e40af" font-size="14" font-weight="700" letter-spacing="0.3">PHASE 5: SECURE WEB MVP DEPLOYMENT</text>

    <!-- FastAPI Backend -->
    <rect x="540" y="1070" width="395" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="737" y="1096" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">FastAPI Asynchronous Backend</text>
    <path d="M 560 1106 L 915 1106" stroke="#e2e8f0" stroke-width="1"/>
    <text x="560" y="1127" fill="#475569" font-size="12">• Model loaded once in memory (lifespan)</text>
    <text x="560" y="1147" fill="#475569" font-size="12">• /predict &amp; /explain API endpoints</text>
    <text x="560" y="1167" fill="#dc2626" font-size="11.5" font-weight="600">⚠ Safe: Never fetches or visits target URLs</text>

    <!-- Connector to Frontend -->
    <line x1="737" y1="1180" x2="737" y2="1205" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Frontend UI Components -->
    <rect x="540" y="1210" width="395" height="210" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="737" y="1235" text-anchor="middle" fill="#1e3a8a" font-size="13.5" font-weight="700">Interactive User Dashboard</text>
    <path d="M 560 1245 L 915 1245" stroke="#bfdbfe" stroke-width="1"/>
    
    <g transform="translate(560, 1260)">
      <rect x="0" y="0" width="355" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="21" fill="#1e293b" font-size="12">Prediction &amp; Confidence Probability Bar</text>

      <rect x="0" y="42" width="355" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="63" fill="#1e293b" font-size="12">Multi-XAI Selector Tabs (IG, LIME, SHAP)</text>

      <rect x="0" y="84" width="355" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="105" fill="#1e293b" font-size="12">Token-Level Attribution Heatmap (Red/Blue)</text>

      <rect x="0" y="126" width="355" height="32" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="147" fill="#1e293b" font-size="12">Signed Component Impact Bar Chart (Domain/Path/Query)</text>
    </g>
  </g>

  <!-- Bottom Footer Note -->
  <text x="500" y="1520" text-anchor="middle" fill="#94a3b8" font-size="12">Final Year Research Project • National Institute of Business Management (NIBM)</text>
</svg>

